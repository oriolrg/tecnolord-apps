[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "speclord"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[tool.setuptools]
packages = ["speclord"]

[tool.pytest.ini_options]
pythonpath = ["."]
