services:
  api_py:
    build: ./pyapi
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SCHEMA: ml
    depends_on: [db]
    expose: ["8000"]

  worker:
    image: prefecthq/prefect:2-latest
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    volumes:
      - ./flows:/opt/flows
    command: ["prefect", "worker", "start", "-p", "default-agent-pool"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 \
      --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    volumes:
      - ./mlruns:/mlartifacts
    expose: ["5000"]

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/000-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    depends_on:
      - db
    expose:
      - "3000"

  # --- ORIENTATRACK (BACKEND API) ---
  orientatrack:
    build:
      context: ./orientatrack/backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PORT=4000
    depends_on:
      - db
    expose:
      - "4000"

  # --- OPOS ---
  opos_backend:
    build:
      context: ./opos_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PORT=5000
    depends_on:
      - db
    expose:
      - "5000"

  # --- UMAMI DB ---
  umami_db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- UMAMI ---
  umami:
    image: ghcr.io/umami-software/umami:3.0.3
    restart: unless-stopped
    depends_on:
      umami_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami_db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    expose:
      - "3000"

  # --- PaP (Nou Servei) ---
  pap_backend:
    build:
      context: ./pap_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PORT=6000
    depends_on:
      - db
    expose:
      - "6000"

  # --- CADDY REVERSE PROXY ---
    caddy:
      image: caddy:2
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
        - "443:443/udp"
        - "2019:2019"
      depends_on: 
        - backend
        - api_py
        - umami
        - orientatrack
        - opos_backend
        - pap_backend
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile:ro
        - ./site:/srv
        # ✅ AFEGIT: frontend orientatrack
        - ./orientatrack/public:/srv/orientatrack:ro
        - caddy_data:/data
        - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  umami_pgdata: {}