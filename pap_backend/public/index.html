<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaP Sant Llorenç - Què toca avui?</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --organica: #b59a6d;
            --envasos: #e6e600;
            --paper: #add8e6;
            --resta: #a9a9a9;
            --text: #2d3748;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        
        .status-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .badge-success { background: #c6f6d5; color: #22543d; }
        .badge-error { background: #fed7d7; color: #822727; }

        .residu-avui { font-size: 2.2rem; margin: 15px 0; font-weight: 800; }
        .icon-box { font-size: 4rem; margin: 20px 0; }

        .properes-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .proxima-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
        }

        footer { margin-top: 40px; font-size: 0.8rem; color: #718096; }
    </style>
</head>

            <i class="fas fa-spinner fa-spin"></i>

        <div class="residu-avui" id="text-avui">Carregant...</div>

    </div>

    <div class="properes-container">
        <h3 style="margin-top:0"><i class="far fa-calendar-alt"></i> Properes recollides</h3>

</body>
</html>
