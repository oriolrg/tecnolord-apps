<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaP Sant Llorenç - Què toca avui?</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --organica: #b59a6d;
            --envasos: #e6e600;
            --paper: #add8e6;
            --resta: #a9a9a9;
            --text: #2d3748;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        
        .status-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .badge-success { background: #c6f6d5; color: #22543d; }
        .badge-error { background: #fed7d7; color: #822727; }

        .residu-avui { font-size: 2.2rem; margin: 15px 0; font-weight: 800; }
        .icon-box { font-size: 4rem; margin: 20px 0; }

        .properes-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .proxima-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
        }

        footer { margin-top: 40px; font-size: 0.8rem; color: #718096; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📍 PaP Sant Llorenç</h1>
        <p id="data-actual">Carregant data...</p>
    </div>

    <div class="status-card">
        <div id="status-badge" class="badge">Sincronitzant...</div>
        <div class="icon-box" id="icona-gran">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
        <div class="residu-avui" id="text-avui">Carregant...</div>
        <p id="missatge-hora"></p>
    </div>

    <div class="properes-container">
        <h3 style="margin-top:0"><i class="far fa-calendar-alt"></i> Properes recollides</h3>
        <div id="llista-properes"></div>
    </div>

    <footer>Recollida abans de les 08:00h del matí</footer>

    <script>
        const icones = {
            "organica": "fa-apple-whole",
            "envasos": "fa-bottle-water",
            "paper_cartro": "fa-box-open",
            "resta": "fa-dumpster",
            "bolquers": "fa-baby"
        };

        const colors = {
            "organica": "#b59a6d",
            "envasos": "#d4d400",
            "paper_cartro": "#3182ce",
            "resta": "#718096"
        };

        async function carregarEstat() {
            try {
                // Fem servir ruta relativa 'estat' perquè Caddy ens redirigeix al backend correcte
                const res = await fetch('estat'); 
                const data = await res.json();

                const d = new Date(data.data_servidor);
                document.getElementById('data-actual').innerText = d.toLocaleDateString('ca-ES', { weekday: 'long', day: 'numeric', month: 'long' });

                const badge = document.getElementById('status-badge');
                const textAvui = document.getElementById('text-avui');
                const icona = document.getElementById('icona-gran');
                
                if (data.passatHora) {
                    badge.className = "badge badge-error";
                    badge.innerText = "Recollida realitzada";
                    document.getElementById('missatge-hora').innerText = "El camió ja ha passat (08:00h).";
                } else {
                    badge.className = "badge badge-success";
                    badge.innerText = "Pots treure la brossa";
                    document.getElementById('missatge-hora').innerText = "Recorda treure-la abans de les 08:00h.";
                }

                if (data.avui.length > 0) {
                    textAvui.innerText = data.avui.map(r => r.nom).join(' + ');
                    icona.innerHTML = `<i class="fas ${icones[data.avui[0].id] || 'fa-trash'}"></i>`;
                    icona.style.color = colors[data.avui[0].id] || '#2d3748';
                } else {
                    textAvui.innerText = "Avui no hi ha recollida";
                    icona.innerHTML = `<i class="fas fa-bed"></i>`;
                    icona.style.color = "#cbd5e0";
                }

                const llista = document.getElementById('llista-properes');
                llista.innerHTML = '';
                for (const [nom, temps] of Object.entries(data.properes_recollides)) {
                    llista.innerHTML += `
                        <div class="proxima-item">
                            <span><strong>${nom}</strong></span>
                            <span>${temps}</span>
                        </div>`;
                }

            } catch (error) {
                document.getElementById('text-avui').innerText = "Error de connexió";
                console.error(error);
            }
        }

        carregarEstat();
    </script>
</body>
</html>
