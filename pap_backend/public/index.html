<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaP Sant Llorenç - Estat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a202c;
            --organica: #8d6e63;
            --envasos: #f6e05e;
            --success: #48bb78;
            --error: #f56565;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; }
        .card { background: var(--card); border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        .badge-ok { background: #c6f6d5; color: #22543d; }
        .badge-ko { background: #fed7d7; color: #822727; }
        .icon { font-size: 3.5rem; margin: 15px 0; color: #4a5568; }
        .residu-nom { font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; }
        .properes { width: 100%; max-width: 450px; margin-top: 20px; background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .proxima-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #edf2f7; }
        .proxima-row:last-child { border: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📍 PaP Sant Llorenç</h1>
        <p id="current-date">...</p>
    </div>

    <div class="card">
        <div id="status-badge" class="badge">Sincronitzant...</div>
        <div id="main-icon" class="icon"><i class="fas fa-circle-notch fa-spin"></i></div>
        <div id="residu-avui" class="residu-nom">Carregant...</div>
        <p id="time-msg" style="font-size: 0.9rem;"></p>
    </div>

    <div class="properes">
        <h4 style="margin: 0 0 10px 0;">Calendari de recollida</h4>
        <div id="next-list"></div>
    </div>

    <footer><p style="font-size: 0.7rem; color: #a0aec0; margin-top: 30px;">Recollida diària a les 08:00h</p></footer>

    <script>
        const ICONS = { "organica": "fa-apple-whole", "envasos": "fa-bottle-water", "paper_cartro": "fa-box-open", "resta": "fa-dumpster", "bolquers": "fa-baby" };
        const COLORS = { "organica": "#8d6e63", "envasos": "#d69e2e", "paper_cartro": "#3182ce", "resta": "#718096" };

        async function updateUI() {
            try {
                // Fem servir 'estat' sense barra inicial per ser relatius al path de Caddy
                const r = await fetch('estat');
                if (!r.ok) throw new Error('404');
                const data = await r.json();

                // Data
                const dateObj = new Date(data.data_servidor);
                document.getElementById('current-date').innerText = dateObj.toLocaleDateString('ca-ES', { weekday: 'long', day: 'numeric', month: 'long' });

                // Badge & Msg
                const badge = document.getElementById('status-badge');
                if (data.passatHora) {
                    badge.innerText = "Recollida finalitzada";
                    badge.className = "badge badge-ko";
                    document.getElementById('time-msg').innerText = "El camió ha passat a les 08:00h.";
                } else {
                    badge.innerText = "Pots treure la brossa";
                    badge.className = "badge badge-ok";
                    document.getElementById('time-msg').innerText = "Encara ets a temps (fins les 08:00h).";
                }

                // Residu Avui
                const resText = document.getElementById('residu-avui');
                const iconDiv = document.getElementById('main-icon');
                if (data.avui.length > 0) {
                    resText.innerText = data.avui.map(x => x.nom).join(' + ');
                    const firstId = data.avui[0].id;
                    iconDiv.innerHTML = `<i class="fas ${ICONS[firstId]}"></i>`;
                    iconDiv.style.color = COLORS[firstId] || '#4a5568';
                } else {
                    resText.innerText = "Avui no hi ha recollida";
                    iconDiv.innerHTML = `<i class="fas fa-bed"></i>`;
                    iconDiv.style.color = "#cbd5e0";
                }

                // Llista properes
                const list = document.getElementById('next-list');
                list.innerHTML = Object.entries(data.properes_recollides).map(([nom, temps]) => `
                    <div class="proxima-row">
                        <span><strong>${nom}</strong></span>
                        <span style="color: #4a5568">${temps}</span>
                    </div>
                `).join('');

            } catch (e) {
                document.getElementById('residu-avui').innerText = "Error de connexió";
                console.error("Fetch error:", e);
            }
        }
        updateUI();
    </script>
</body>
</html>
