<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OrientaTrack Pro - Rogaine Mode</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3182ce;
            --rogaine-red: #e53e3e;
            --dark: #1a202c;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background: #f0f0f0;
        }

        /* Vistes de l'aplicació */
        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
        .view.active { display: block; }

        #map { width: 100%; height: 100%; }

        /* Estils comuns per pantalles de text */
        .screen-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 10; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }

        .fita-icon {
            background: white; border: 2px solid var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--primary);
        }

        #fites-menu {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 80%; max-height: 50vh; background: white; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 2000; overflow-y: auto; display: none;
        }

        .fita-item {
            padding: 12px 15px; border-bottom: 1px solid #edf2f7;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }

        .bottom-ui {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--dark); padding-bottom: env(safe-area-inset-bottom);
        }

        .main-menu {
            display: flex; justify-content: space-around; padding: 10px 0;
        }

        .menu-btn {
            flex: 1; background: none; border: none; color: #a0aec0;
            display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 3px;
            cursor: pointer;
        }
        .menu-btn.active { color: white; }
        
        #btn-permis {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; padding: 15px 30px; background: var(--primary);
            color: white; border: none; border-radius: 8px; font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="btn-permis">INICIAR SESSIÓ</button>

    <div id="view-joc" class="view active">
        <div id="map-legend-container"></div> 
        <div id="map"></div>
        <div id="compass-container"></div>
        <div id="fites-menu"></div>
    </div>

    <div id="view-sos" class="view">
        <div id="map-sos" style="width:100%; height:100%;"></div>
        <div style="position:absolute; top:20px; left:20px; z-index:1000; background:rgba(229, 62, 62, 0.9); color:white; padding:10px; border-radius:8px;">
            ⚠️ MODE SOS ACTIU (Penalització aplicada)
        </div>
    </div>

    <div id="view-perfil" class="view">
        <div class="screen-content">
            <h2>El meu Perfil</h2>
            <div id="perfil-stats">
                <p>Carregant dades...</p>
            </div>
        </div>
    </div>

    <div class="bottom-ui">
        <div id="navigation-panel-container"></div>
        <div id="main-menu-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
