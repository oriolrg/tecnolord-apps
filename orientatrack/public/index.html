<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OrientaTrack Pro - Rogaine Mode</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3182ce;
            --rogaine-red: #e53e3e;
            --dark: #1a202c;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background: #f0f0f0;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Estil per a les fites numerades al mapa */
        .fita-icon {
            background: white; border: 2px solid #ff00ff; border-radius: 50%;
            color: #ff00ff; font-weight: bold; display: flex;
            align-items: center; justify-content: center; font-size: 11px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #btn-permis {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            padding: 10px 25px; background: var(--dark); color: white;
            border: none; border-radius: 50px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }

        .bottom-ui {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 200;
            display: flex; flex-direction: column;
        }

        .main-menu {
            display: flex; background: var(--dark); padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .menu-btn {
            flex: 1; background: none; border: none; color: #a0aec0;
            display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 3px;
        }
        .menu-btn.active { color: white; }
    </style>
</head>
<body>

    <button id="btn-permis">INICIAR SESSIÓ</button>

    <div id="map-legend-container"></div> 

    <div id="map"></div>
    <div id="compass-container"></div>
    <div id="fites-menu"></div>
    
    <div class="bottom-ui">
        <div id="navigation-panel-container"></div>
        <nav class="main-menu">
            <button class="menu-btn"><i class="fas fa-map"></i><span>Mapa</span></button>
            <button class="menu-btn active"><i class="fas fa-compass"></i><span>Joc</span></button>
            <button id="btn-fites" class="menu-btn"><i class="fas fa-list-ol"></i><span>Fites</span></button>
            <button class="menu-btn"><i class="fas fa-skull-crossbones"></i><span>SOS</span></button>
            <button class="menu-btn"><i class="fas fa-user-circle"></i><span>Perfil</span></button>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
