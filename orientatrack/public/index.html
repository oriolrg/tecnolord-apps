<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OrientaTrack - Professional Rogaine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3182ce;
            --rogaine-red: #e53e3e;
            --dark: #1a202c;
            --glass: rgba(255, 255, 255, 0.3);
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* LLEGENDA CARTOGRÀFICA DINÀMICA */
        #map-legend {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: none;
        }

        #scale-bar {
            width: 100px; /* Es modifica per JS */
            height: 6px;
            background: white;
            border: 1px solid black;
            background-image: linear-gradient(90deg, black 50%, white 50%);
            background-size: 50px 6px; 
            margin-bottom: 4px;
        }

        #scale-label, #numeric-scale {
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: black;
        }

        /* BRÚIXOLA DE PLACA (Silva Style) */
        #compass-plate {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 170px;
            height: 250px;
            background: var(--glass);
            backdrop-filter: blur(4px);
            border: 1.5px solid rgba(0,0,0,0.15);
            border-radius: 4px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            touch-action: none;
            cursor: move;
        }

        /* Regle lateral mètric (1cm = 38px aprox) */
        .ruler {
            position: absolute;
            left: 0; top: 10px; 
            height: 152px; /* 4cm * 38px */
            width: 60px;
            border-right: 1.5px solid var(--rogaine-red);
            display: flex;
            flex-direction: column;
        }

        .ruler span {
            height: 38px; /* 1cm físic */
            position: relative;
            padding-left: 5px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--rogaine-red);
            display: flex;
            align-items: flex-start;
        }

        .ruler span::after {
            content: ''; position: absolute; right: 0; top: 0;
            width: 15px; height: 1.5px; background: var(--rogaine-red);
        }

        /* El valor en metres injectat per JS */
        .ruler span::before {
            content: attr(data-dist);
            position: absolute;
            left: 22px;
            font-size: 0.55rem;
            background: rgba(255,255,255,0.6);
            padding: 0 2px;
            border-radius: 2px;
        }

        .direction-line {
            width: 3px; height: 45px;
            background: var(--rogaine-red);
            margin-top: 10px; position: relative;
        }

        #bezel {
            width: 120px; height: 120px;
            border: 8px solid var(--dark);
            border-radius: 50%;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
            transition: transform 0.1s linear;
        }

        .degree-numbers span { position: absolute; font-weight: bold; font-size: 0.8rem; }
        .n { top: 4px; left: 50%; transform: translateX(-50%); color: var(--rogaine-red); }
        .e { right: 6px; top: 50%; transform: translateY(-50%); }
        .s { bottom: 4px; left: 50%; transform: translateX(-50%); }
        .w { left: 6px; top: 50%; transform: translateY(-50%); }

        .needle {
            position: absolute; top: 50%; left: 50%;
            width: 3px; height: 80%;
            background: linear-gradient(to bottom, var(--rogaine-red) 50%, #3182ce 50%);
            transform: translate(-50%, -50%);
        }

        #heading-display { font-size: 1.6rem; font-weight: bold; margin-top: 8px; color: var(--dark); }

        /* UI INFERIOR */
        .bottom-ui { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 200; }
        #target-card-full { background: white; padding: 12px 20px; border-top: 1px solid #e2e8f0; }
        .data-row { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; }
        .target-main { flex: 2; }
        .data-box { flex: 1; text-align: center; border-left: 1px solid #edf2f7; }
        .label { font-size: 0.6rem; color: #718096; text-transform: uppercase; }
        .target-name-val { font-size: 1rem; font-weight: bold; color: var(--primary); display: block; }
        .value { font-size: 1.2rem; font-weight: bold; color: var(--dark); }

        .main-menu {
            display: flex; background: var(--dark); padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .menu-btn {
            flex: 1; background: none; border: none; color: #a0aec0;
            display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 3px;
        }
        .menu-btn.active { color: white; }
        .menu-btn i { font-size: 1.1rem; }

        #btn-permis {
            position: fixed; top: 15px; left: 15px; z-index: 600;
            padding: 10px 20px; background: var(--dark); color: white;
            border: none; border-radius: 50px; font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="btn-permis">INICIAR SESSIÓ</button>

    <div id="map-legend">
        <div id="scale-bar-container">
            <div id="scale-bar"></div>
            <div id="scale-label">100 m</div>
        </div>
        <div id="numeric-scale">1 : 5.000</div>
    </div>

    <div id="map"></div>

    <div id="compass-plate" class="draggable">
        <div class="ruler">
            <span data-dist="0m">0</span>
            <span data-dist="--">1</span>
            <span data-dist="--">2</span>
            <span data-dist="--">3</span>
            <span data-dist="--">4</span>
        </div>
        <div class="direction-line"></div>
        <div id="bezel">
            <div class="degree-numbers">
                <span class="n">N</span><span class="e">E</span>
                <span class="s">S</span><span class="w">W</span>
            </div>
            <div class="needle"></div>
        </div>
        <div id="heading-display">0°</div>
    </div>

    <div class="bottom-ui">
        <div id="target-card-full">
            <div class="data-row">
                <div class="target-main">
                    <span class="label">Fita actual</span>
                    <span id="target-name" class="target-name-val">Localitzant...</span>
                </div>
                <div class="data-box">
                    <span class="label">Rumb</span>
                    <span id="target-bearing" class="value">--°</span>
                </div>
                <div class="data-box">
                    <span class="label">Distància</span>
                    <span id="target-distance" class="value">-- m</span>
                </div>
            </div>
        </div>
        <nav class="main-menu">
            <button class="menu-btn"><i class="fas fa-map"></i><span>Mapa</span></button>
            <button class="menu-btn active"><i class="fas fa-location-crosshairs"></i><span>Joc</span></button>
            <button class="menu-btn"><i class="fas fa-flag"></i><span>Fites</span></button>
            <button class="menu-btn"><i class="fas fa-skull-crossbones"></i><span>SOS</span></button>
            <button class="menu-btn"><i class="fas fa-user"></i><span>Perfil</span></button>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script type="module" src="js/compass.js"></script>
</body>
</html>
