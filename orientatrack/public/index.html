<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OrientaTrack Pro - Rogaine Mode</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3182ce;
            --rogaine-red: #e53e3e;
            --dark: #1a202c;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background: #f0f0f0;
        }

        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; display: none; 
        }
        .view.active { display: block; }

        #map { width: 100%; height: 100%; z-index: 1; }

        .screen-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }

        /* ESTIL ICONES MAPA */
        .fita-icon {
            background: white; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            z-index: 500;
        }
        .fita-activa { 
            border: 2px solid var(--primary); 
            color: var(--primary); 
        }
        .fita-pendent { 
            border: 2px solid #ff00ff; 
            color: #ff00ff; 
        }

        .bottom-ui {
            position: fixed; 
            bottom: 0; left: 0; width: 100%; 
            z-index: 2000; 
            background: var(--dark); 
            padding-bottom: env(safe-area-inset-bottom);
        }

        #btn-permis {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; padding: 15px 30px; background: var(--primary);
            color: white; border: none; border-radius: 8px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <button id="btn-permis">INICIAR SESSIÓ</button>

    <div id="view-joc" class="view active">
        <div id="map"></div>
        <div id="map-legend-container" style="position: absolute; top: 20px; left: 20px; z-index: 1100;"></div> 
    </div>

    <div id="view-sos" class="view">
        <div id="map-sos" style="width:100%; height:100%;"></div>
        <div style="position:absolute; top:20px; left:20px; z-index:2000; background:rgba(229, 62, 62, 0.9); color:white; padding:15px; border-radius:8px; font-weight: bold;">
            ⚠️ MODE SOS ACTIU
        </div>
    </div>

    <div id="view-perfil" class="view">
        <div class="screen-content">
            <h2>El meu Perfil</h2>
            <hr>
            <div id="perfil-stats">
                <p>Carregant dades...</p>
            </div>
        </div>
    </div>

    <div id="view-rutes" class="view">
        <div id="route-selector-container"></div>
    </div>

    <div class="bottom-ui">
        <div id="navigation-panel-container"></div>
        <div id="main-menu-container"></div>
    </div>

    <div id="fites-menu"></div>
    <div id="compass-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
