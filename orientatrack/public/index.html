<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrientaTrack - Test Brúixola</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
        
        #compass-container {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #arrow {
            font-size: 5rem;
            color: #3182ce;
            transition: transform 0.1s ease-out; /* Moviment suau */
        }

        .info { margin-top: 30px; text-align: center; }
        button { padding: 15px 30px; font-size: 1rem; border-radius: 50px; border: none; background: #3182ce; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="compass-container">
        <i id="arrow" class="fas fa-location-arrow"></i>
    </div>

    <div class="info">
        <h2 id="heading">0°</h2>
        <p>Apunta el mòbil per veure el rumb</p>
        <button id="btn-permis">Activar Brúixola</button>
    </div>

    <script src="./js/compass.js"></script>
</body>
</html>
