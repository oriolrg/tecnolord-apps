<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OrientaTrack Pro - Rogaine Mode</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3182ce;
            --rogaine-red: #e53e3e;
            --dark: #1a202c;
            --glass: rgba(255, 255, 255, 0.15);
            --ruler-color: #000000;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* LLEGENDA CARTOGRÀFICA */
        #map-legend {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px; border: 1.5px solid #333;
            z-index: 500; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); pointer-events: none;
        }

        #scale-bar {
            width: 100px; height: 6px; background: white; border: 1px solid black;
            background-image: linear-gradient(90deg, black 50%, white 50%);
            background-size: 50px 6px; margin-bottom: 4px;
        }

        #scale-label, #numeric-scale { font-size: 0.7rem; font-family: monospace; font-weight: bold; color: black; }

        /* BRÚIXOLA DE PLACA */
        #compass-plate {
            position: absolute; top: 100px; right: 20px;
            width: 180px; height: 280px;
            background: var(--glass);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0,0,0,0.1);
            z-index: 100; touch-action: none; cursor: move;
            border-top-left-radius: 0;
            overflow: hidden; /* Manté els regles dins */
        }

        /* REGLE SUPERIOR (Marge extrem) */
        .ruler-top {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 15px; /* Línia més a prop del marge */
            border-bottom: 2px solid var(--ruler-color);
            display: flex;
        }
        .ruler-top span {
            width: 38px; height: 100%;
            border-left: 2px solid var(--ruler-color);
            font-size: 0.65rem; font-weight: bold; color: var(--ruler-color);
            padding-left: 2px; flex-shrink: 0;
        }

        /* REGLE LATERAL (Marge extrem) */
        .ruler-left {
            position: absolute; left: 0; top: 0;
            width: 15px; height: 100%; /* Línia més a prop del marge */
            border-right: 2px solid var(--ruler-color);
            display: flex; flex-direction: column;
        }
        .ruler-left span {
            height: 38px; width: 100%;
            border-top: 2px solid var(--ruler-color);
            font-size: 0.65rem; font-weight: bold; color: var(--ruler-color);
            padding-top: 2px; padding-left: 2px; flex-shrink: 0;
        }

        /* ESPAI DE LA BRÚIXOLA (Centrat en l'espai restant) */
        .compass-inner {
            margin-top: 30px;
            margin-left: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: calc(100% - 15px);
            height: calc(100% - 30px);
        }

        .direction-line {
            width: 3px; height: 30px;
            background: var(--rogaine-red);
            margin-bottom: 10px;
            position: relative;
        }
        .direction-line::after {
            content: ''; position: absolute; top: -5px; left: -4px;
            border-left: 5px solid transparent; border-right: 5px solid transparent;
            border-bottom: 8px solid var(--rogaine-red);
        }

        #bezel {
            width: 110px; height: 110px; /* Reduït per deixar aire */
            border: 6px solid var(--dark);
            border-radius: 50%;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .degree-numbers span { position: absolute; font-weight: bold; font-size: 0.8rem; }
        .n { top: 2px; left: 50%; transform: translateX(-50%); color: var(--rogaine-red); }
        .e { right: 4px; top: 50%; transform: translateY(-50%); }
        .s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .w { left: 4px; top: 50%; transform: translateY(-50%); }

        .needle {
            position: absolute; top: 50%; left: 50%;
            width: 2px; height: 85%;
            background: linear-gradient(to bottom, var(--rogaine-red) 50%, #3182ce 50%);
            transform: translate(-50%, -50%);
        }

        #heading-display { font-size: 1.6rem; font-weight: bold; margin-top: 15px; color: var(--dark); }

        /* UI INFERIOR */
        .bottom-ui { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 200; }
        #target-card-full { background: white; padding: 12px 20px; border-top: 1px solid #e2e8f0; }
        .data-row { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; }
        .label { font-size: 0.65rem; color: #718096; text-transform: uppercase; }
        .value { font-size: 1.3rem; font-weight: bold; color: var(--dark); }

        .main-menu {
            display: flex; background: var(--dark); padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .menu-btn {
            flex: 1; background: none; border: none; color: #a0aec0;
            display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 3px;
        }
        .menu-btn.active { color: white; }

        #btn-permis {
            position: fixed; top: 15px; left: 15px; z-index: 600;
            padding: 10px 25px; background: var(--dark); color: white;
            border: none; border-radius: 50px; font-weight: bold;
        }
    </style>
</head>
<body>

    <button id="btn-permis">INICIAR SESSIÓ</button>

    <div id="map-legend">
        <div id="scale-bar"></div>
        <div id="scale-label">--- m</div>
        <div id="numeric-scale">1 : ---</div>
    </div>

    <div id="map"></div>

    <div id="compass-plate" class="draggable">
        <div class="ruler-top">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>
        </div>
        <div class="ruler-left">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>
        </div>
        
        <div class="compass-inner">
            <div class="direction-line"></div>
            <div id="bezel">
                <div class="degree-numbers">
                    <span class="n">N</span><span class="e">E</span>
                    <span class="s">S</span><span class="w">W</span>
                </div>
                <div class="needle"></div>
            </div>
            <div id="heading-display">0°</div>
        </div>
    </div>

    <div class="bottom-ui">
        <div id="target-card-full">
            <div class="data-row">
                <div style="flex: 2;">
                    <span class="label">Objectiu</span>
                    <span id="target-name" style="font-weight: bold; color: var(--primary); display: block;">Localitzant...</span>
                </div>
                <div style="flex: 1; text-align: center; border-left: 1px solid #edf2f7;">
                    <span class="label">Rumb</span>
                    <span id="target-bearing" class="value">--°</span>
                </div>
                <div style="flex: 1; text-align: center; border-left: 1px solid #edf2f7;">
                    <span class="label">Distància</span>
                    <span id="target-distance" class="value">-- m</span>
                </div>
            </div>
        </div>
        <nav class="main-menu">
            <button class="menu-btn"><i class="fas fa-map"></i><span>Mapa</span></button>
            <button class="menu-btn active"><i class="fas fa-compass"></i><span>Joc</span></button>
            <button class="menu-btn"><i class="fas fa-list-ol"></i><span>Fites</span></button>
            <button class="menu-btn"><i class="fas fa-skull-crossbones"></i><span>SOS</span></button>
            <button class="menu-btn"><i class="fas fa-user-circle"></i><span>Perfil</span></button>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script type="module" src="js/compass.js"></script>
</body>
</html>
