<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrientaTrack - Rogaine Mode</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3182ce;
            --rogaine-red: #e53e3e;
            --dark: #1a202c;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Mapa dominant */
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* 2. Placa de la brúixola (Silva Style) */
        #compass-plate {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 260px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 2px solid white;
            border-radius: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .direction-line {
            width: 3px;
            height: 40px;
            background: var(--rogaine-red);
            margin-top: 10px;
            position: relative;
        }

        #bezel {
            width: 140px;
            height: 140px;
            border: 10px solid var(--dark);
            border-radius: 50%;
            position: relative;
            background: white;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s linear;
        }

        .degree-numbers span {
            position: absolute;
            font-weight: bold;
            font-size: 1rem;
        }
        .n { top: 5px; left: 50%; transform: translateX(-50%); color: var(--rogaine-red); }
        .e { right: 8px; top: 50%; transform: translateY(-50%); }
        .s { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .w { left: 8px; top: 50%; transform: translateY(-50%); }

        #heading-display {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 10px;
            color: var(--dark);
        }

        /* 3. Targeta d'Objectiu */
        #target-card {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 160px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary);
        }

        .label { font-size: 0.65rem; color: #718096; text-transform: uppercase; display: block; }
        .value { font-size: 1.2rem; font-weight: bold; display: block; margin-bottom: 5px; }

        .controls { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
        button { 
            padding: 12px 25px; border-radius: 50px; border: none; 
            background: var(--dark); color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        #debug-console { position: fixed; bottom: 0; left: 0; font-size: 0.6rem; color: #ccc; pointer-events: none; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="compass-plate">
        <div class="direction-line"></div>
        <div id="bezel">
            <div class="degree-numbers">
                <span class="n">N</span><span class="e">E</span>
                <span class="s">S</span><span class="w">W</span>
            </div>
            <div id="magnetic-needle" style="width: 2px; height: 100%; background: linear-gradient(to bottom, red 50%, blue 50%); position: absolute; opacity: 0.5;"></div>
        </div>
        <div id="heading-display">0°</div>
    </div>

    <div id="target-card">
        <span class="label">Objectiu</span>
        <span id="target-name" style="font-size: 0.9rem; font-weight: bold;">--</span>
        <hr style="border: 0.5px solid #edf2f7; margin: 10px 0;">
        <span class="label">Rumb Destí</span>
        <span id="target-bearing" class="value">--°</span>
        <span class="label">Distància</span>
        <span id="target-distance" class="value">-- m</span>
    </div>

    <div class="controls">
        <button id="btn-permis">ACTIVA BRÚIXOLA</button>
    </div>

    <div id="debug-console"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/compass.js"></script>
</body>
</html>
